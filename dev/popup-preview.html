<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>渐读设置预览</title>
    <link rel="stylesheet" href="../dist/popup.css" />
    <style>html { display: grid; min-height: 100%; place-items: start center; padding-top: 30px; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      let previewActive = false;
      let previewSettings = {
        cefrLevel: "B1",
        intensity: "gentle",
        displayMode: "mixed",
        autoSites: [],
        provider: {
          mode: "local",
          baseUrl: "http://localhost:11434/v1",
          model: "qwen2.5:7b",
          apiKey: "",
        },
      };
      window.chrome = {
        tabs: { query: async () => [{ id: 1, url: "https://example.com/article" }] },
        permissions: { request: async () => true },
        runtime: {
          sendMessage: async (message) => {
            if (message.type === "GET_STATE") return { ok: true, data: { settings: previewSettings, stats: {} } };
            if (message.type === "GET_ACTIVE_TAB_STATUS") return { ok: true, data: { active: previewActive } };
            if (message.type === "TOGGLE_ACTIVE_TAB") {
              previewActive = !previewActive;
              return { ok: true, data: { active: previewActive } };
            }
            if (message.type === "SAVE_SETTINGS") {
              previewSettings = { ...previewSettings, ...message.settings };
              return { ok: true, data: previewSettings };
            }
            if (message.type === "REGISTER_AUTO_SITE") {
              previewSettings.autoSites = [message.origin];
              return { ok: true, data: previewSettings };
            }
            if (message.type === "UNREGISTER_AUTO_SITE") {
              previewSettings.autoSites = [];
              return { ok: true, data: previewSettings };
            }
            return { ok: true, data: "预览环境连接成功" };
          },
        },
      };
    </script>
    <script src="../dist/popup.js"></script>
  </body>
</html>
